name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Cada lunes: los avisos nuevos aparecen aunque nadie haya subido cambios.
  schedule:
    - cron: "0 14 * * 1"

permissions:
  contents: read

jobs:
  pipeline:
    name: Pipeline IA (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/pipeline_ai
    # Postgres desechable: las pruebas de la base de usuarios corren contra SQLite Y Postgres
    # (tests/conftest.py exige este servicio cuando CI=true). Misma imagen que el compose.
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
        env:
          POSTGRES_DB: mhia
          POSTGRES_USER: mhia
          POSTGRES_PASSWORD: solo-para-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mhia -d mhia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/pipeline_ai/requirements-dev.lock

      # Versiones exactas con hash: las mismas que la imagen Docker y la Mac.
      - name: Instalar dependencias
        run: pip install --require-hashes -r requirements-dev.lock

      - name: Lint (ruff)
        run: ruff check pipeline_ai tests eval

      - name: Formato (black --check)
        run: black --check pipeline_ai tests eval

      - name: Tests (pytest)
        run: pytest -v
        env:
          # Los tests no requieren servicios reales ni credenciales reales
          # (ver pipeline_ai/config.py Settings.require), salvo el Postgres desechable.
          ANTHROPIC_API_KEY: ""
          MHIA_TEST_POSTGRES_HOST: localhost
          MHIA_TEST_POSTGRES_PORT: "5432"
          MHIA_TEST_POSTGRES_PASSWORD: solo-para-ci

  web:
    name: GUI (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          API_INTERNAL_URL: http://mhia-api:8000

  secrets-scan:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # CLI oficial vía Docker (la acción gitleaks-action pide licencia en organizaciones).
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source /repo --no-banner --redact --verbose

  shell:
    name: Scripts de la Mac (shellcheck + plist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # shellcheck viene preinstalado en ubuntu-latest. -s bash: el bash 3.2 de macOS.
      - name: shellcheck
        run: |
          shellcheck -s bash scripts/mac/*.sh
          shellcheck -s sh .githooks/pre-push
      - name: Sintaxis bash
        run: for f in scripts/mac/*.sh; do bash -n "$f"; done

  docker:
    name: Docker (compose válido + build amd64/arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar compose (con .env.example)
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml -f docker-compose.host-ollama.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.host-ollama.yml -f docker-compose.dev.yml config --quiet
          # Variante Colima (Mac mini): la IP del host se puede fijar por .env.
          MHIA_HOST_GATEWAY=192.168.5.2 docker compose -f docker-compose.yml -f docker-compose.host-ollama.yml config --quiet

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # La Mac mini es ARM64: verificamos que la imagen de la API compile ahí.
      - name: Build API (linux/amd64 + linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: services/pipeline_ai
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deps-audit:
    name: Dependencias (pip-audit + npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pip-audit fijado con hash, como el resto de las dependencias.
      - name: Instalar pip-audit
        run: pip install --require-hashes -r .github/herramientas/pip-audit.lock

      # Cualquier aviso con versión corregida en las dependencias de la API rompe el CI.
      - name: pip-audit (API y pruebas)
        working-directory: services/pipeline_ai
        run: |
          pip-audit -r requirements.lock --require-hashes --disable-pip --progress-spinner off
          pip-audit -r requirements-dev.lock --require-hashes --disable-pip --progress-spinner off

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Lo que se despliega (dependencies) no admite ni avisos moderados; las
      # herramientas de desarrollo (lint, pruebas) rompen el CI desde "high".
      - name: npm audit (GUI)
        working-directory: web
        run: |
          npm audit --omit=dev --audit-level=moderate
          npm audit --audit-level=high

  images-scan:
    name: Imágenes (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build API (amd64, para escanear)
        uses: docker/build-push-action@v6
        with:
          context: services/pipeline_ai
          load: true
          tags: mhia-api:ci
          cache-from: type=gha,scope=escaneo-api
          cache-to: type=gha,mode=max,scope=escaneo-api

      - name: Build GUI (amd64, para escanear)
        uses: docker/build-push-action@v6
        with:
          context: web
          load: true
          tags: mhia-web:ci
          build-args: API_INTERNAL_URL=http://mhia-api:8000
          cache-from: type=gha,scope=escaneo-web
          cache-to: type=gha,mode=max,scope=escaneo-web

      # La base de avisos de Trivy se descarga una vez al día.
      - name: Fecha para la caché de Trivy
        id: fecha
        run: echo "hoy=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.fecha.outputs.hoy }}
          restore-keys: trivy-db-

      # Rompe el CI con cualquier aviso HIGH o CRITICAL que ya tenga corrección
      # (paquetes del sistema y de Python/Node dentro de la imagen). Un aviso
      # aceptado va en .trivyignore con su motivo y fecha de revisión (SECURITY.md).
      - name: Trivy
        run: |
          for img in mhia-api:ci mhia-web:ci; do
            echo "::group::$img"
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$HOME/.cache/trivy:/root/.cache/trivy" \
              -v "$PWD:/repo:ro" \
              mirror.gcr.io/aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c \
              image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
              --ignorefile /repo/.trivyignore --exit-code 1 --no-progress "$img"
            echo "::endgroup::"
          done
