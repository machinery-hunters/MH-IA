version: "3.9"

# ─────────────────────────────────────────────────────────────────────────
# OVERRIDE: Producción — Mac Mini M4 Pro
#
# Ollama NO se containeriza aquí: corre nativo en macOS (brew install ollama
# o la app Ollama.app) para usar el GPU/Metal del M4 Pro al 100%. Docker
# Desktop en macOS no tiene passthrough de GPU Apple Silicon a contenedores
# Linux, así que containerizarlo forzaría CPU-only y perderías la mayoría
# del rendimiento de inferencia local.
#
# Pre-requisito en el host Mac:
#   brew install ollama
#   ollama serve  (o dejar correr Ollama.app en background / como launchd)
#   ollama pull llama3.1:8b
#   ollama pull nomic-embed-text
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.mac.yml up -d
# ─────────────────────────────────────────────────────────────────────────

services:
  mhia-app:
    environment:
      # host.docker.internal resuelve al host Mac en Docker Desktop
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
