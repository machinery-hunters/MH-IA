# ─────────────────────────────────────────────────────────────────────────
# OVERRIDE: Producción — Mac mini M5 Pro
#
# Ollama NO se containeriza: corre nativo en macOS para usar Metal al 100%
# (Docker Desktop en Mac no pasa la GPU de Apple Silicon a contenedores
# Linux). Todas las imágenes de este stack son compatibles con ARM64.
#
# Pre-requisito en el host Mac:
#   brew install ollama
#   brew services start ollama      # escucha solo en 127.0.0.1 por defecto
#   ollama pull llama3.1:8b
#   ollama pull nomic-embed-text
#
# NO cambies OLLAMA_HOST a 0.0.0.0: Ollama no tiene autenticación.
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.mac.yml up -d --build
# ─────────────────────────────────────────────────────────────────────────

services:
  mhia-api:
    environment:
      # host.docker.internal resuelve al host Mac en Docker Desktop
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
