# ─────────────────────────────────────────────────────────────────────────
# OVERRIDE OPCIONAL: Laptop de desarrollo con Ollama EN CONTENEDOR
# Acer Predator Helios Neo 16S AI · Core Ultra 9 · RTX 5070 Ti (12GB VRAM) · 32GB RAM
#
# El modo por defecto es docker-compose.host-ollama.yml (Ollama nativo, igual
# que la Mac). Este override queda para probar Ollama aislado en un contenedor
# con la GPU NVIDIA por WSL2 (algo que la Mac no puede hacer).
#   .\scripts\dev.ps1 up -OllamaMode docker
#
# Requisitos previos en el host:
#   - Driver NVIDIA para Windows actualizado (>= 550.x, RTX 50-series)
#   - Docker Desktop con backend WSL2 y soporte de GPU
#   - Verificar:
#       docker run --rm --gpus all nvidia/cuda:12.4.1-base-ubuntu22.04 nvidia-smi
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
#
# Ollama NO publica puerto: solo mhia-api lo alcanza por la red "backend".
# Los modelos se descargan con:
#   docker exec -it mhia-ollama ollama pull llama3.1:8b
#   docker exec -it mhia-ollama ollama pull nomic-embed-text
# ─────────────────────────────────────────────────────────────────────────

services:

  ollama:
    # Misma versión que se instala nativa en la Mac y en Windows (scripts/ollama-models.txt).
    image: ollama/ollama:0.40.15@sha256:0e59999e0e8f9fd4e704bd788a89b7e4cad399367fb1365f8c102ac662288761
    container_name: mhia-ollama
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - backend
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # 12GB VRAM: cómodo para llama3.1:8b / qwen2.5:14b-instruct-q4 / nomic-embed-text
    # en simultáneo. Evitar modelos >20B sin cuantización agresiva.

  mhia-api:
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama

volumes:
  ollama_data:
