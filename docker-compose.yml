# ─────────────────────────────────────────────────────────────────────────
# BASE común a ambos entornos (laptop RTX 5070 Ti / Mac mini M5 Pro).
# NO define "ollama" aquí porque su acceso a GPU cambia entre plataformas;
# se activa vía overrides:
#
#   Modo por defecto en AMBOS equipos (Ollama NATIVO en el host):
#     docker compose -f docker-compose.yml -f docker-compose.host-ollama.yml up -d --build
#     - Mac mini M5 Pro: único modo soportado (Metal no pasa a contenedores).
#     - Laptop Windows: mismo modo, para que dev y producción sean iguales.
#   Alternativa en la laptop (Ollama en contenedor con GPU NVIDIA):
#     docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
#   Desarrollo con recarga de código (se suma a cualquiera de los dos):
#     ... -f docker-compose.dev.yml
#
# Imágenes: fijadas por versión Y digest (sha256). Dependabot propone las
# actualizaciones; se prueban en la laptop antes de llegar a la Mac.
#
# Red y puertos (ver SECURITY.md):
#   - Qdrant y Ollama NO publican puertos al host: solo son alcanzables por
#     mhia-api dentro de la red interna "backend".
#   - Solo mhia-api (8000) y web (3000) publican puerto, y SOLO en 127.0.0.1.
#     El acceso remoto lo da Tailscale en el host (`tailscale serve`), nunca
#     un puerto abierto a la LAN ni a internet.
#   - web no está en la red "backend" y NO recibe el .env (sin secretos).
# ─────────────────────────────────────────────────────────────────────────

x-base: &base
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true

# api y web corren como usuario sin privilegios: además se les quitan todas
# las capabilities de Linux. Qdrant (imagen de terceros) solo recibe `base`.
x-hardening: &hardening
  <<: *base
  cap_drop:
    - ALL

services:

  qdrant:
    <<: *base
    # Misma versión que qdrant-client (requirements.txt): el cliente exige mismo major y
    # diferencia de minor <= 1. Al subir uno, sube el otro (y reindexa si hay datos).
    image: qdrant/qdrant:v1.19.1@sha256:12364fe851b9f17356fc88189fc06d1b521262e04659ec7345975b00c9246a10
    container_name: mhia-qdrant
    # Sin "ports:": inalcanzable desde el host y la LAN. Para inspeccionar
    # manualmente, usa `docker compose exec` o un override local temporal.
    volumes:
      - qdrant_data:/qdrant/storage
      - ./qdrant/config.yaml:/qdrant/config/production.yaml:ro
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=INFO
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  mhia-api:
    <<: *hardening
    build:
      context: ./services/pipeline_ai
      dockerfile: Dockerfile
    container_name: mhia-api
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./credentials:/app/credentials:ro
      - ./data:/app/data # manifest de sync de Drive y auth.db (usuarios y sesiones)
      - ./backups:/app/backups # respaldos (python -m pipeline_ai.ops.backup), fuera de git
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      qdrant:
        condition: service_healthy
    networks:
      - backend
      - edge

  web:
    <<: *hardening
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # Los rewrites de Next se resuelven en build, no en runtime.
        API_INTERNAL_URL: http://mhia-api:8000
    container_name: mhia-web
    # Deliberadamente SIN env_file ni environment: la GUI no recibe ningún
    # secreto del backend.
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    depends_on:
      mhia-api:
        condition: service_healthy
    networks:
      - edge

networks:
  # backend: api + qdrant (+ ollama en la laptop). edge: web + api.
  # Así web nunca puede resolver ni alcanzar Qdrant ni Ollama.
  backend:
    driver: bridge
  edge:
    driver: bridge

volumes:
  qdrant_data:
