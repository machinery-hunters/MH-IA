version: "3.9"

# ─────────────────────────────────────────────────────────────────────────
# BASE común a ambos entornos (laptop RTX 5070 Ti / Mac Mini M4 Pro).
# NO define el servicio "ollama" aquí porque su forma de acceso a GPU
# cambia radicalmente entre plataformas. Se activa vía overrides:
#
#   Laptop (Windows/WSL2 o Linux, NVIDIA RTX 5070 Ti, contenedor con GPU):
#     docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
#   Mac Mini M4 Pro (producción, Ollama NATIVO en el host, sin Docker):
#     docker compose -f docker-compose.yml -f docker-compose.mac.yml up -d
#
# La app (mhia-app) siempre lee OLLAMA_BASE_URL desde .env / el override
# correspondiente — el código Python (app/config.py) no cambia entre
# entornos, solo la variable de entorno.
# ─────────────────────────────────────────────────────────────────────────

services:

  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: mhia-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
      - ./qdrant/config.yaml:/qdrant/config/production.yaml:ro
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=INFO
    networks:
      - mhia_net
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  mhia-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mhia-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
    volumes:
      - ./app:/app/app
      - ./credentials:/app/credentials:ro
      - ./data:/app/data          # manifest de sync incremental de Drive
    depends_on:
      qdrant:
        condition: service_healthy
    networks:
      - mhia_net

networks:
  mhia_net:
    driver: bridge

volumes:
  qdrant_data:
